<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebReaper — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #ccc; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #0f0f1a; border: 1px solid #2a1a3e; padding: 40px; width: 400px; text-align: center; }
        .logo { font-size: 3em; margin-bottom: 10px; }
        h1 { color: #9b59b6; font-size: 1.4em; margin-bottom: 5px; }
        .subtitle { color: #555; margin-bottom: 30px; font-size: 0.8em; }
        input { width: 100%; background: #0a0a0f; border: 1px solid #2a1a3e; color: #ccc; padding: 12px; margin-bottom: 15px; font-family: 'Courier New', monospace; }
        input:focus { outline: none; border-color: #9b59b6; }
        button { width: 100%; background: #6c3483; border: none; color: #fff; padding: 12px; font-family: 'Courier New', monospace; font-size: 1em; cursor: pointer; }
        button:hover { background: #7d3c98; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🕷️</div>
        <h1>WebReaper</h1>
        <p class="subtitle">Phishing Simulation Panel</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Authenticate</button>
        </form>
    </div>
</body>
</html>
