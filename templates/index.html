<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebReaper — Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0f; color: #ccc; font-family: 'Courier New', monospace; }
        .header { background: #0f0f1a; border-bottom: 2px solid #2a1a3e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #9b59b6; font-size: 1.2em; }
        .header a { color: #e74c3c; text-decoration: none; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #0f0f1a; border: 1px solid #2a1a3e; padding: 20px; text-align: center; }
        .stat-card .number { font-size: 2em; color: #9b59b6; }
        .stat-card .label { font-size: 0.8em; color: #555; margin-top: 5px; }
        .section { background: #0f0f1a; border: 1px solid #2a1a3e; padding: 20px; margin-bottom: 20px; }
        .section h2 { color: #9b59b6; font-size: 1em; margin-bottom: 15px; border-bottom: 1px solid #2a1a3e; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { text-align: left; color: #9b59b6; padding: 10px; border-bottom: 1px solid #2a1a3e; }
        td { padding: 10px; border-bottom: 1px solid #1a1a2e; }
        button { background: #6c3483; border: none; color: #fff; padding: 8px 16px; font-family: 'Courier New', monospace; cursor: pointer; }
        button:hover { background: #7d3c98; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🕷️ WebReaper Dashboard</h1>
        <a href="/logout">Logout</a>
    </div>
    <div class="container">
        <div class="stats">
            <div class="stat-card"><div class="number">0</div><div class="label">Campaigns</div></div>
            <div class="stat-card"><div class="number">0</div><div class="label">Clicks</div></div>
            <div class="stat-card"><div class="number">0</div><div class="label">Captures</div></div>
            <div class="stat-card"><div class="number">🕷️</div><div class="label">Status</div></div>
        </div>
        <div class="section">
            <h2>📋 Campaigns</h2>
            <p style="color:#555; text-align:center; padding:40px;">No campaigns yet.</p>
        </div>
    </div>
</body>
</html>
